name: Desktop alpha build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a public GitHub prerelease from this run.
        required: false
        type: boolean
        default: false
      release_tag:
        description: Required when publishing manually, for example v0.1.0-alpha.1.
        required: false
        type: string
      release_title:
        description: Optional public release title.
        required: false
        type: string
  push:
    branches:
      - main
      - dev
      - "codex/**"
      - "jude/**"
    tags:
      - "v*-alpha.*"

permissions:
  contents: read

concurrency:
  group: desktop-alpha-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 builds
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content -Path "package.json" | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build ChatExportMate desktop bundle
        run: pnpm tauri build

      - name: Collect ChatExportMate installer and portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.package.outputs.version }}"
          $releaseDir = "artifacts/release-assets"
          $installerDir = "artifacts/windows-x64-chatexportmate-installer"
          $portableDir = "artifacts/windows-x64-chatexportmate-portable"
          New-Item -ItemType Directory -Force -Path $releaseDir, $installerDir, $portableDir | Out-Null

          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "ChatExportMate_${version}_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "ChatExportMate NSIS installer was not produced."
          }

          Copy-Item -LiteralPath $installer.FullName -Destination $installerDir
          Copy-Item -LiteralPath $installer.FullName -Destination "$releaseDir/ChatExportMate-$version-windows-x64-setup.exe"
          Copy-Item -Path "src-tauri/target/release/chat-export-mate.exe" -Destination "$portableDir/ChatExportMate.exe"
          Copy-Item -Path "README.md", "LICENSE", "ACKNOWLEDGEMENTS.md" -Destination $portableDir
          @"
          ChatExportMate portable alpha

          Extract this artifact and run ChatExportMate.exe.

          This portable build does not create Start Menu entries, desktop shortcuts, or an uninstaller. It still stores app data, managed exporter binaries, preferences, and logs in the normal ChatExportMate app data location.

          This alpha build is unsigned. Windows may show an unknown-publisher warning.
          "@ | Set-Content -Path "$portableDir/PORTABLE-NOTES.txt" -Encoding utf8
          Compress-Archive -Path "$portableDir/*" -DestinationPath "$releaseDir/ChatExportMate-$version-windows-x64-portable.zip" -Force

          Get-ChildItem -Path $installerDir, $portableDir, $releaseDir | Format-Table FullName, Length

      - name: Build Spenlio SMS Exporter desktop bundle
        run: pnpm tauri:build:spenlio

      - name: Collect Spenlio SMS Exporter installer and portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.package.outputs.version }}"
          $releaseDir = "artifacts/release-assets"
          $installerDir = "artifacts/windows-x64-spenlio-installer"
          $portableDir = "artifacts/windows-x64-spenlio-portable"
          New-Item -ItemType Directory -Force -Path $releaseDir, $installerDir, $portableDir | Out-Null

          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "Spenlio SMS Exporter_${version}_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Spenlio SMS Exporter NSIS installer was not produced."
          }

          Copy-Item -LiteralPath $installer.FullName -Destination $installerDir
          Copy-Item -LiteralPath $installer.FullName -Destination "$releaseDir/SpenlioSmsExporter-$version-windows-x64-setup.exe"
          Copy-Item -Path "src-tauri/target/release/chat-export-mate.exe" -Destination "$portableDir/SpenlioSmsExporter.exe"
          Copy-Item -Path "README.md", "LICENSE", "ACKNOWLEDGEMENTS.md" -Destination $portableDir
          @"
          Spenlio SMS Exporter portable alpha

          Extract this artifact and run SpenlioSmsExporter.exe.

          This portable build focuses on local iPhone backup to Spenlio-compatible finance CSV export. It does not create Start Menu entries, desktop shortcuts, or an uninstaller. It stores app data, preferences, and logs in the normal local app data location for Spenlio SMS Exporter.

          This alpha build is unsigned. Windows may show an unknown-publisher warning.
          "@ | Set-Content -Path "$portableDir/PORTABLE-NOTES.txt" -Encoding utf8
          Compress-Archive -Path "$portableDir/*" -DestinationPath "$releaseDir/SpenlioSmsExporter-$version-windows-x64-portable.zip" -Force

          Get-ChildItem -Path $installerDir, $portableDir, $releaseDir | Format-Table FullName, Length

      - name: Upload ChatExportMate Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChatExportMate-alpha-windows-x64-installer-${{ github.run_number }}
          path: artifacts/windows-x64-chatexportmate-installer/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload ChatExportMate Windows portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChatExportMate-alpha-windows-x64-portable-${{ github.run_number }}
          path: artifacts/windows-x64-chatexportmate-portable/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Spenlio Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpenlioSmsExporter-alpha-windows-x64-installer-${{ github.run_number }}
          path: artifacts/windows-x64-spenlio-installer/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Spenlio Windows portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpenlioSmsExporter-alpha-windows-x64-portable-${{ github.run_number }}
          path: artifacts/windows-x64-spenlio-portable/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload release-ready Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: ChatExportMate-alpha-windows-x64-release-assets-${{ github.run_number }}
          path: artifacts/release-assets/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub prerelease
    needs: windows-x64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release)
      }}

    permissions:
      contents: write

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: ChatExportMate-alpha-windows-x64-release-assets-${{ github.run_number }}
          path: release-assets

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.release_tag }}"
          fi

          if [[ -z "${tag}" ]]; then
            echo "::error::release_tag is required when publish_release is true on a manual workflow run."
            exit 1
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-alpha[.][0-9]+$ ]]; then
            echo "::error::Use an alpha semver tag such as v0.1.0-alpha.1 while the project is experimental."
            exit 1
          fi

          title="${{ inputs.release_title }}"
          if [[ -z "${title}" ]]; then
            title="ChatExportMate ${tag} alpha"
          fi

          {
            echo "tag=${tag}"
            echo "title=${title}"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate release notes preface
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          target="${GITHUB_SHA}"
          if git rev-parse --verify --quiet "${RELEASE_TAG}^{commit}" >/dev/null; then
            target="${RELEASE_TAG}^{commit}"
          fi

          previous_tag="$(git tag --sort=-creatordate --merged "${target}" --list 'v*' | grep -F -x -v "${RELEASE_TAG}" | head -n 1 || true)"
          if [[ -n "${previous_tag}" ]]; then
            range="${previous_tag}..${target}"
          else
            range="${target}"
          fi

          {
            echo "This is an experimental alpha release. The Windows builds are unsigned, local-first desktop builds for testing and feedback."
            echo
            echo "## Downloads"
            echo "- ChatExportMate installer: use the setup EXE for normal Windows installation."
            echo "- ChatExportMate portable: extract the ZIP first, then run ChatExportMate.exe."
            echo "- Spenlio SMS Exporter installer: use the setup EXE for the focused Spenlio CSV edition."
            echo "- Spenlio SMS Exporter portable: extract the ZIP first, then run SpenlioSmsExporter.exe."
            echo
            echo "## Commit changes"
            if [[ -n "${previous_tag}" ]]; then
              echo "Changes since ${previous_tag}:"
            else
              echo "Recent changes included in this alpha:"
            fi
          } > release-notes.md

          changes="$(git log --no-merges -n 50 --pretty=format:'- %s (%h)' "${range}" || true)"
          if [[ -n "${changes}" ]]; then
            printf '%s\n' "${changes}" >> release-notes.md
          else
            echo "- No commit subjects were found for this range." >> release-notes.md
          fi

          echo >> release-notes.md
          echo >> release-notes.md
          echo "GitHub-generated release notes are appended below when pull request metadata is available." >> release-notes.md

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists. Create a new alpha tag or delete the existing draft/release before rerunning."
            exit 1
          fi

          release_notes="$(cat release-notes.md)"
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}" \
            --notes "${release_notes}" \
            --generate-notes \
            --prerelease \
            --latest=false \
            --target "${GITHUB_SHA}"
