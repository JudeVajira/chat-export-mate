name: Desktop alpha build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: desktop-alpha-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 builds
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Tauri desktop bundles
        run: pnpm tauri build

      - name: Collect Windows installer
        shell: pwsh
        run: |
          $installerDir = "artifacts/windows-x64-installer"
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          Copy-Item -Path "src-tauri/target/release/bundle/nsis/*.exe" -Destination $installerDir
          Get-ChildItem -Path $installerDir | Format-Table Name, Length

      - name: Collect Windows portable app
        shell: pwsh
        run: |
          $portableDir = "artifacts/windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -Path "src-tauri/target/release/chat-export-mate.exe" -Destination "$portableDir/ChatExportMate.exe"
          Copy-Item -Path "README.md", "LICENSE", "ACKNOWLEDGEMENTS.md" -Destination $portableDir
          @"
          ChatExportMate portable alpha

          Extract this artifact and run ChatExportMate.exe.

          This portable build does not create Start Menu entries, desktop shortcuts, or an uninstaller. It still stores app data, managed exporter binaries, preferences, and logs in the normal ChatExportMate app data location.

          This alpha build is unsigned. Windows may show an unknown-publisher warning.
          "@ | Set-Content -Path "$portableDir/PORTABLE-NOTES.txt" -Encoding utf8
          Get-ChildItem -Path $portableDir | Format-Table Name, Length

      - name: Upload Windows alpha installers
        uses: actions/upload-artifact@v7
        with:
          name: ChatExportMate-alpha-windows-x64-installer-${{ github.run_number }}
          path: artifacts/windows-x64-installer/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows alpha portable app
        uses: actions/upload-artifact@v7
        with:
          name: ChatExportMate-alpha-windows-x64-portable-${{ github.run_number }}
          path: artifacts/windows-x64-portable/*
          if-no-files-found: error
          retention-days: 14
